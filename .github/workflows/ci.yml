name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: WebAdViewCore (macOS host, fast)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build pure-logic core
        run: swift build --target WebAdViewCore

  tests:
    name: Package tests + Example build (iOS simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # Didomi ships an iOS-only binary xcframework, so `swift test` on the
      # macOS host can never work — everything runs against a simulator.
      # The simulator model depends on the runner's Xcode image, so pick the
      # first available iPhone dynamically instead of hardcoding a name.
      - name: Pick an available iPhone simulator
        run: |
          SIM_NAME=$(xcrun simctl list devices available | grep -oE 'iPhone [^(]*' | head -1 | xargs)
          echo "Using simulator: $SIM_NAME"
          echo "SIM_NAME=$SIM_NAME" >> "$GITHUB_ENV"
      - name: Run test suites (WebAdViewCoreTests + WebAdViewSDKTests)
        run: |
          xcodebuild test \
            -scheme WebAdViewSDK \
            -destination "platform=iOS Simulator,name=$SIM_NAME"
      - name: Build Example app against the local package
        run: |
          xcodebuild build \
            -project "Example/Project AdView.xcodeproj" \
            -scheme "Project AdView" \
            -destination "platform=iOS Simulator,name=$SIM_NAME" \
            CODE_SIGNING_ALLOWED=NO

  flutter:
    name: Flutter plugin (analyze, test, iOS simulator build)
    runs-on: macos-15
    # The Swift SDK repository carries no Flutter folder — run only in the
    # Flutter repository (hashFiles() is not allowed in a job-level `if`).
    if: github.repository == 'STEP-Network/WebAdView-Flutter-apps-on-iOS-and-Android-SDK'
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Analyze and test the plugin
        working-directory: Flutter/webadview_flutter
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Build the example app for the simulator (resolves the SDK by local path)
        working-directory: Flutter/webadview_flutter/example
        env:
          WEBADVIEW_SDK_PATH: ${{ github.workspace }}
        run: |
          flutter pub get
          flutter build ios --simulator --debug
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Kotlin unit tests + Android debug build
        working-directory: Flutter/webadview_flutter/example
        run: |
          flutter build apk --debug
          (cd android && ./gradlew :webadview_flutter:testDebugUnitTest)
